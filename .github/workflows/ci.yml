name: MiniRTOS CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Build main application
        run: |
          gcc -Wall -Wextra -Wpedantic \
            src/main.c \
            src/scheduler.c \
            src/tasks.c \
            -Iinclude \
            -o scheduler

      - name: Build unit tests
        run: |
          gcc -Wall -Wextra -Wpedantic \
            tests/test_scheduler.c \
            src/scheduler.c \
            -Iinclude \
            -o test_runner \
            -lm

      - name: Run unit tests
        run: |
          ./test_runner